name: "WORK 13 - Diagnostico SSH de homologacao"

# Este workflow NAO faz deploy nem executa comandos arbitrarios no servidor.
# A chave SSH deve ser autorizada no cPanel com 'command=...,restrict'.
# Requer acoes manuais do proprietario antes da primeira execucao.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-readonly:
    name: Inspecao SSH com comando forçado (somente leitura)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: homologacao
    steps:
      - name: Validar variaveis e secrets
        env:
          HOST: ${{ vars.STAGING_SSH_HOST }}
          USERNAME: ${{ vars.STAGING_SSH_USER }}
          PORT: ${{ vars.STAGING_SSH_PORT }}
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in HOST USERNAME PORT SSH_KEY HOST_KEYS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configuracao de SSH incompleta: ${name}"
              exit 1
            fi
          done
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$PORT >= 1 && 10#$PORT <= 65535 )) || {
            echo "::error::Porta SSH invalida"
            exit 1
          }
          [[ "$USERNAME" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            echo "::error::Nome de usuario SSH invalido"
            exit 1
          }
          [[ "$HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]] || {
            echo "::error::Hostname SSH invalido"
            exit 1
          }

      - name: Testar SSH com chave restrita, sem liberar shell
        env:
          HOST: ${{ vars.STAGING_SSH_HOST }}
          USERNAME: ${{ vars.STAGING_SSH_USER }}
          PORT: ${{ vars.STAGING_SSH_PORT }}
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/work13_probe_key"
          printf '%s\n' "$HOST_KEYS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/work13_probe_key" "$HOME/.ssh/known_hosts"' EXIT

          # O comando "false" serve para garantir que a chave SO funciona
          # quando o servidor substitui o comando pela probe autorizada.
          # Sem a restricao command=, o SSH executaria false e falharia.
          report="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o ConnectTimeout=12 \
            -i "$HOME/.ssh/work13_probe_key" -p "$PORT" \
            "$USERNAME@$HOST" 'false')"
          echo "$report"
          grep -Fqx 'RIFAONLINE_STAGING_PROBE_OK' <<< "$report" || {
            echo "::error::A chave nao executou o comando remoto restrito"
            exit 1
          }
